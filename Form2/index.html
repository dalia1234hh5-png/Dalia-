<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form2</title>
</head>
<body>
    <h1>Course Registration</h1>
    <form action method="get">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter your name">
        <br>
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your email">
        <br>
        <br>
        <label for="co">Name Course:</label>
        <input type="text" id="co" placeholder="HTML or Java">
        <br>
        <br>
        <label for="nm">Number of Meetings:</label>
        <input type="number" id="nm" placeholder="Enter number of meetings">
        <br>
        <br>
       <label for="te">Telephone:</label>
        <input type="tel" id="te" placeholder="Enter your telephone number"> 
        <br>
        <br>
        <button type="submit">Send</button>
        <button type="reset">Reset</button>
        <button type="button">Button</button>
    </form>
</body>
</html>
