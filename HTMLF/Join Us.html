<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Us</title>
</head>
<body>
    <fieldset>
        <legend>Join Us</legend>
        <form action="" method="get" enctype="multipart/form-data">
            <label for="name">Name :</label><br>
            <input type="text" id="name" placeholder="Enter name" name="name"><br><br>
            <label for="email">Email :</label><br>
            <input type="email" id ="email" placeholder="Enter email" name="email"><br><br>
            <label for="Ph">Phone number :</label><br>
            <input type="tel" id="Ph" placeholder="Enter Phone" name="Phone"><br><br>
            <label for="age">Enter Age :</label><br>
            <input type="number" id="age" name="age"><br><br>
            <br>
            <label for=""><strong>Membership Plan</strong></label><br>
            <label for="c"><input type="radio" id="c" name="o">Monthly Subscription</label><br>
            <label for="d"><input type="radio" id="d" name="o">3-Month Subscription</label><br>
            <label for="v"><input type="radio" id="v" name="o">Annual Subscription / Yearly Subscription</label>
            <br><br>
            <label for=""><strong>Select Area :</strong></label>
            <select name="" id="">
                <option value="" disabled>Choose Location</option>
                <option value="">Rafah</option>
                <option value="">Khan Younis</option>
                <option value="">Central Governorate</option>
                <option value="">Gaza</option>
            </select>
            <br><br>
            <label><strong>Preferred Training Time</strong></label><br>
            <label for="m"><input type="radio" id="m" name="mm">Morning Session</label><br>
            <label for="z"><input type="radio" id="z" name="mm">Evening Session</label>
            <br><br><br>
             <label for=""><Strong>Fitness Goal</Strong></label><br>
            <label for="aa"></label><input type="checkbox" id="aa">Weight Loss</label><br>
            <label for="ss"><input type="checkbox" id="ss">Muscle Building</label><br>
            <label for="ff"><input type="checkbox">General Fitness</label><br>
            <label for="vv"><input type="checkbox" id="vv">Personal Training</label>
            <br><br><br>
            <label for=""><Strong>Add a picture</Strong></label>
            <input type="file">
            <br><br><br>
            <label for="h"><strong>Medical / Health Notes :</strong></label><br><br>
            <textarea id="h" rows="12" placeholder="Notes"></textarea>
            <br><br><br>
            <button type="submit">Register</button>
            <button type="reset">Reset</button>
        </form>
    </fieldset>
    <button><a href="index.html">Home Page</a></button>
</body>
</html>
